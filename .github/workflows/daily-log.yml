name: Daily Engineering Log

on:
  schedule:
    - cron: "15 4 * * *"
    - cron: "15 8 * * *"
    - cron: "15 12 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create daily entry
        run: |
          mkdir -p daily

          DATE=$(date -u +"%Y-%m-%d")
          TIME=$(date -u +"%H:%M UTC")
          RUN_ID="${{ github.run_id }}"

          FILE="daily/${DATE}-${RUN_ID}.md"

          echo "# Engineering Log — ${DATE}" > "$FILE"
          echo "" >> "$FILE"
          echo "## Daily Checkpoint" >> "$FILE"
          echo "" >> "$FILE"
          echo "- Time: ${TIME}" >> "$FILE"
          echo "- Recorded a small engineering journal entry." >> "$FILE"
          echo "- Reviewed ongoing development work." >> "$FILE"
          echo "- Next focus: make a practical improvement to a project." >> "$FILE"
          echo "" >> "$FILE"
          echo "This entry is generated by the daily engineering-log workflow." >> "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          git commit -m "docs: engineering log ${DATE} ${TIME}"
          git push
